[server]
headless = true
runOnSave = false
# Serve ./static at /app/static (campus photo + DIT logo on the student page).
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# Hide the Deploy button and developer menu for students and admins.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1d63ed"
backgroundColor = "#f4f7fc"
secondaryBackgroundColor = "#eaf0fa"
textColor = "#0f172a"
linkColor = "#1d63ed"
borderColor = "#e2e8f0"
showWidgetBorder = true
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap, sans-serif"
headingFontWeights = [800, 700, 700, 700, 600, 600]
chartCategoricalColors = ["#1d63ed", "#16a34a", "#ef4444", "#f5a524", "#7c3aed", "#0891b2", "#db2777", "#64748b"]

[theme.sidebar]
backgroundColor = "#0a1f4d"
secondaryBackgroundColor = "#12306b"
textColor = "#dbe6fb"
primaryColor = "#1d63ed"
borderColor = "#12306b"
